# Publishes the site to Netlify on every push to main.
#
# We deploy through the Netlify CLI rather than Netlify's own Git integration,
# because connecting a private organisation-owned repository to Netlify needs a
# Pro plan. A CLI deploy has no such restriction, so this keeps the repository
# private and free. To move to the native integration later, link the repo in
# Netlify and delete this file.
#
# Requires two repository secrets:
#   NETLIFY_AUTH_TOKEN - a Netlify personal access token
#   NETLIFY_SITE_ID    - the target Netlify project's ID

name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race; the newest commit always wins.
concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to production
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      - name: Set up Node for the Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish public/ to Netlify
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=public \
            --prod \
            --message "${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME} via GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
